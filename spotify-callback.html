<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAT VERSE Spotify Login</title>
</head>
<body>
  <h2>BEAT VERSE</h2>
  <p>Spotify login callback received.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");

    if (error) {
      document.body.innerHTML += "<p>Spotify login cancelled or failed.</p>";
    } else if (code) {
      sessionStorage.setItem("spotify_auth_code", code);
      document.body.innerHTML += "<p>Login response received. Return to BEAT VERSE.</p>";
    } else {
      document.body.innerHTML += "<p>No login response found.</p>";
    }
  </script>
</body>
</html>
