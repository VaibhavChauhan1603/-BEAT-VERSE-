<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAT VERSE Spotify Login</title>
</head>
<body>
  <h2>BEAT VERSE</h2>
  <p>Completing Spotify connection...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    if (error) {
      document.body.innerHTML =
        "<h2>Spotify login failed</h2><p>" + error + "</p>";
    } else if (code && state) {
      localStorage.setItem("bv_spotify_callback_code", code);
      localStorage.setItem("bv_spotify_callback_state", state);
      window.location.replace("/-BEAT-VERSE-/");
    } else {
      document.body.innerHTML =
        "<h2>Spotify response missing</h2><p>Please try again.</p>";
    }
  </script>
</body>
</html>
